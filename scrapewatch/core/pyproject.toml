[project]
name = "scrapewatch"
version = "0.1.0"
description = "Open-source observability for web scrapers: catches challenge pages behind fake 200s, schema drift, and silent data failures."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "scraping",
    "web-scraping",
    "observability",
    "anti-bot",
    "monitoring",
    "playwright",
    "httpx",
    "requests",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/bogdanborutenko/scrapewatch"
Documentation = "https://github.com/bogdanborutenko/scrapewatch/tree/main/docs"
Repository = "https://github.com/bogdanborutenko/scrapewatch"
Issues = "https://github.com/bogdanborutenko/scrapewatch/issues"

[project.optional-dependencies]
requests = ["requests>=2.28.0"]
httpx = ["httpx>=0.25.0"]
playwright = ["playwright>=1.40"]
all = ["requests>=2.28.0", "httpx>=0.25.0", "playwright>=1.40"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.4",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# NOTE: Run tests with `uv run python -m pytest` not `uv run pytest`
# The `-m` flag ensures the correct Python module path resolution

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
